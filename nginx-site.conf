upstream evok {
        server 127.0.0.1:8080; #port Evok runs on, change this line only if you change the port in configuration of Evok
}

server {
	listen 80 default_server;
	server_name  _;

	#ssl on;
	#ssl_certificate      /etc/nginx/democert.pem;
	#ssl_certificate_key  /etc/nginx/democert.key;

	#access_log  /var/log/evok.access.log;
	access_log  off;
	root /opt/evok/www;

	location / {
	    index index.html;
	}

	location /favicon.ico {
		alias /opt/evok/www/favicon.ico;
	}

	location /ws {
		proxy_pass http://evok;
		proxy_set_header Host $host:$server_port;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 180;
	}

	# Evok refuses a request without its token by 401 with "WWW-Authenticate: Basic", a browser would show
	# its own login dialog instead of the dialog of the token of evok-web
	location /rest {
		proxy_pass http://evok;
		proxy_set_header Host      $host:$server_port;
		proxy_hide_header WWW-Authenticate;
	}

	location /json {
		proxy_pass http://evok;
		proxy_set_header Host      $host:$server_port;
		proxy_hide_header WWW-Authenticate;
	}
	location /bulk {
		proxy_pass http://evok;
		proxy_set_header Host	$host:$server_port;
		proxy_hide_header WWW-Authenticate;
	}
	location /rpc {
		proxy_pass http://evok;
		proxy_set_header Host	$host:$server_port;
		proxy_hide_header WWW-Authenticate;
	}
	location /version {
		proxy_pass http://evok;
		proxy_set_header Host	$host:$server_port;
	}

}
