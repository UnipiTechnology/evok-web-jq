<!DOCTYPE html>
<!--[if lt IE 7 ]>
<html class="ie ie6" lang="en"> <![endif]-->
<!--[if IE 7 ]>
<html class="ie ie7" lang="en"> <![endif]-->
<!--[if IE 8 ]>
<html class="ie ie8" lang="en"> <![endif]-->
<!--[if (gte IE 9)|!(IE)]><!-->
<html lang="en"> <!--<![endif]-->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unipi</title>
    <meta name="description" content="">
    <meta name="author" content="">

    <!-- Favicons
    ================================================== -->
    <link rel="shortcut icon" href="favicon.ico">

    <!-- CSS
    ================================================== -->
    <link rel="stylesheet" type="text/css" href="css/jquery.mobile-1.4.5.min.css"/>
    <!-- Added --------------------------------------->
    <link id="darkMode" rel="stylesheet" type="text/css" href="css/jquery.mobile-1.4.5.min.dark.css"/>
    <!-- -------------------------------------------- -->

    <!-- Javascript
    ================================================== -->
    <script src="js/jquery.min.js"></script>
    <script src="js/jquery.mobile.js"></script>
    <script rel="javascript" type="text/javascript" src="js/main.js"></script>
    <script type="text/javascript">
        $(document).ready(function() {
            webSocketRegister();
            updateValues();

            /* Added ---------------------------------------*/
            var isDarkMode = localStorage.getItem('darkMode') === 'true';
            if(isDarkMode) {
                document.getElementById('darkMode').disabled = false;
            } else {
                document.getElementById('darkMode').disabled = true;
            }
            /* --------------------------------------------- */

        });
    </script>

  <style>
  .cmax8 {
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
    #position: static;
    padding-left:0;
    padding-right:0;
  }
  /* --------------------------------------------- */
  </style>

</head>
<body>


<!-- OVERVIEW page -->
<div data-role="page" id="page-overview">
    <div data-role="header"  class="cmax8" data-id="pageHeader" data-position="fixed">
        <h2>Unipi Control Panel</h2>
		<img src="/css/images/spinner.svg" class="ui-btn-right" id="unipi_loading_spinner" style="max-height: 80%;visibility: hidden;"/>
        <img src="/css/images/dark-mode.svg" class="ui-btn-left" onclick="toggleDarkMode()" style="max-height: 80%">
    </div>
    <div data-role="main" class="ui-content cmax8">
      <div data-role="tabs" >
        <div data-role="navbar">
            <ul>
                <li><a href="#inputs" data-theme="a" data-ajax="false" class="ui-btn-active">Inputs</a></li>
                <li><a href="#outputs" data-theme="a" data-ajax="false">Outputs</a></li>
                <li><a href="#system" data-theme="a" data-ajax="false">System</a></li>
                <li><a href="#configs" data-theme="a" data-ajax="false">Configuration</a></li>
            </ul>
        </div>
        <div id="inputs" class="ui-content" data-inset="true">
            <ul data-role="listview" id="inputs_list" data-count-theme="b" data-inset="true" data-split-icon="gear">
                <li data-role="list-divider" data-theme="a" id="unipi_di_divider">Digital</li>
                <li data-role="list-divider" data-theme="a" id="unipi_ai_divider">Analog</li>
                <li data-role="list-divider" data-theme="a" id="unipi_temp_divider">1Wire Sensors/Devices</li>
                <li data-role="list-divider" data-theme="a" id="unipi_data_point_divider">Data points</li>
            </ul>
        </div>
        <!-- /inputs -->

        <div id="outputs" class="ui-content" data-inset="true">
            <ul data-role="listview" id="outputs_list" data-count-theme="b" data-inset="true" data-split-icon="gear">
				<li data-role="list-divider" data-theme="a" id="unipi_light_channel_divider" style="display: none;">DALI Channels</li>
                <li data-role="list-divider" data-theme="a" id="unipi_do_divider">Digital</li>
                <li data-role="list-divider" data-theme="a" id="unipi_ro_divider">Relays</li>
				<li data-role="list-divider" data-theme="a" id="unipi_led_divider">LEDs</li>
                <li data-role="list-divider" data-theme="a" id="unipi_ao_divider">Analog</li>
            </ul>
        </div>
        <!-- /outputs -->
        
        <div id="system" class="ui-content" data-inset="true">
            <ul data-role="listview" id="system_list" data-count-theme="b" data-inset="true" data-split-icon="gear">
                <li data-role="list-divider" data-theme="a" id="unipi_device_info_divider">Devices</li>
                <li data-role="list-divider" data-theme="a" id="unipi_watchdog_divider">Watchdog</li>
                <li data-role="list-divider" data-theme="a" id="unipi_modbus_slave_divider">Modbus slaves</li>
        	</ul>
        </div>
        <!-- /system -->
        
        <div id="configs" class="ui-content" data-inset="true">
        	<div id="unipi_save_all_button_div">
        		<button class="ui-btn ui-corner-all" id="unipi_save_all_button">Save current state to Flash</button>
        		<button class="ui-btn ui-corner-all" id="unipi_token_button">Evok API token</button>
        	</div>
        </div>
        <!-- /configs -->
        
        <!-- /content -->
      </div>
      <!-- /tabs -->
    </div>
    <div data-role="popup" id="unipi_config_form_div">
    	<form id="unipi_config_form">
    		<div style="padding:20px 20px;" class="" id="unipi_config_form_inner_div">
    		</div>
    	</form>
    </div>
    <div data-role="popup" id="unipi_token_popup">
    	<form id="unipi_token_form">
    		<div style="padding:20px 20px;">
    			<h3>Evok API token</h3>
    			<p id="unipi_token_message"></p>
    			<label for="unipi_token_field">Token (apis: token or read_token of the configuration of Evok):</label>
    			<input type="password" id="unipi_token_field" autocomplete="off">
    			<input type="submit" value="Submit">
    			<button type="button" class="ui-btn ui-corner-all" id="unipi_token_clear_button">Forget token</button>
    		</div>
    	</form>
    </div>
    <div data-role="footer" data-position="fixed" data-tap-toggle="false" class="jqm-footer">
        <h1>Unipi.technology</h1>
    </div>
    <!-- /footer -->
</div>

<script type="text/javascript">
    function toggleDarkMode() {
        var isDarkMode = localStorage.getItem('darkMode') === 'true';
        document.getElementById('darkMode').disabled = isDarkMode;
        localStorage.setItem('darkMode', !isDarkMode);
    }
</script>

</body>
</html>
