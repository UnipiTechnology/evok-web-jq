<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Evok Web</title>
        <link rel="icon" href="favicon.ico" />
        <link rel="stylesheet" href="css/style.css" />
        <script>
            // the theme before the first paint: the choice of the user, else the one of the system
            (function () {
                var dark = null;
                try {
                    dark = localStorage.getItem("darkMode");
                } catch (error) {}
                if (dark === null) {
                    dark =
                        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                            ? "true"
                            : "false";
                }
                document.documentElement.dataset.theme = dark === "true" ? "dark" : "light";
            })();
        </script>
        <script src="js/main.js" defer></script>
    </head>
    <body>
        <header class="topbar">
            <div class="brand">
                <svg class="brand-mark" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                    <rect x="1" y="1" width="26" height="26" rx="7" stroke="currentColor" stroke-width="2" />
                    <path
                        d="M8 14h4l2-5 3 10 2-5h1"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
                <div class="brand-text">
                    <span class="brand-name">Evok Web</span>
                    <span class="brand-device" id="brand-device"></span>
                </div>
            </div>
            <div class="connection" id="connection" data-state="connecting">
                <span class="connection-dot"></span>
                <span id="connection-text">Connecting…</span>
            </div>
            <div class="spacer"></div>
            <nav class="actions" aria-label="Actions">
                <button type="button" class="button" id="save-button">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path
                            d="M3 2h8l2 2v10H3z M5 2v4h5V2 M5 14v-4h6v4"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linejoin="round"
                        />
                    </svg>
                    <span>Save to flash</span>
                </button>
                <button type="button" class="button" id="reset-button">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path
                            d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                    <span>Reset units</span>
                </button>
                <button
                    type="button"
                    class="button icon-button"
                    id="token-button"
                    aria-label="Evok API token"
                    title="Evok API token"
                >
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <circle cx="5" cy="8" r="3" stroke="currentColor" stroke-width="1.4" />
                        <path
                            d="M8 8h6M12 8v2.5M14 8v2"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linecap="round"
                        />
                    </svg>
                </button>
                <button
                    type="button"
                    class="button icon-button"
                    id="theme-button"
                    aria-label="Dark mode"
                    title="Dark mode"
                >
                    <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path
                            d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linejoin="round"
                        />
                    </svg>
                    <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4" />
                        <path
                            d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"
                            stroke="currentColor"
                            stroke-width="1.4"
                            stroke-linecap="round"
                        />
                    </svg>
                </button>
            </nav>
        </header>

        <div class="layout">
            <aside class="units" aria-label="Units">
                <div class="unit-select">
                    <label for="unit-select">Unit</label>
                    <select id="unit-select"></select>
                </div>
                <div id="unit-list"></div>
            </aside>
            <main class="content" id="content">
                <p class="placeholder" id="placeholder">Loading the devices of Evok…</p>
            </main>
        </div>

        <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

        <dialog class="dialog" id="config-dialog" aria-labelledby="config-title">
            <form id="config-form" method="dialog">
                <h2 id="config-title"></h2>
                <p class="dialog-subtitle" id="config-subtitle"></p>
                <div class="fields" id="config-fields"></div>
                <p class="form-error" id="config-error" role="alert" hidden></p>
                <div class="dialog-buttons">
                    <button type="button" class="button" data-close>Cancel</button>
                    <button type="submit" class="button primary">Save</button>
                </div>
            </form>
        </dialog>

        <dialog class="dialog" id="units-dialog" aria-labelledby="units-title">
            <form id="units-form" method="dialog">
                <h2 id="units-title"></h2>
                <p class="dialog-subtitle" id="units-message"></p>
                <fieldset class="choices" id="units-choices">
                    <legend class="visually-hidden">Units</legend>
                </fieldset>
                <div class="dialog-buttons">
                    <button type="button" class="button" data-close>Cancel</button>
                    <button type="submit" class="button primary" id="units-submit"></button>
                </div>
            </form>
        </dialog>

        <dialog class="dialog" id="token-dialog" aria-labelledby="token-title">
            <form id="token-form" method="dialog">
                <h2 id="token-title">Evok API token</h2>
                <p class="dialog-subtitle" id="token-message"></p>
                <div class="fields">
                    <div class="field">
                        <label for="token-field"
                            >Token (token or read_token of apis in the configuration of Evok)</label
                        >
                        <input type="password" id="token-field" autocomplete="off" />
                    </div>
                </div>
                <div class="dialog-buttons">
                    <button type="button" class="button" id="token-clear">Forget token</button>
                    <button type="button" class="button" data-close>Cancel</button>
                    <button type="submit" class="button primary">Save</button>
                </div>
            </form>
        </dialog>
    </body>
</html>
